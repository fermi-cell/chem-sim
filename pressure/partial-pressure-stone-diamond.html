            function downloadCurrentHtml() {
                const clone = document.documentElement.cloneNode(true);
                
                // Clear any dynamically injected WebGL canvas & temporary elements in clone
                const canvasCont = clone.querySelector('#threeContainer');
                if (canvasCont) canvasCont.innerHTML = '';
                const ticksGroup = clone.querySelector('#dialTicksGroup');
                if (ticksGroup) ticksGroup.innerHTML = '';
                const latexElem = clone.querySelector('#latexIdealGasFormula');
                if (latexElem) latexElem.innerHTML = '';
                const eqCont = clone.querySelector('#equationContainer');
                if (eqCont) eqCont.innerHTML = '';
                ['badgeBoxH2', 'badgeBoxHe', 'badgeBoxO2'].forEach(id => {
                    const el = clone.querySelector('#' + id);
                    if (el) el.innerHTML = '';
                });

                const htmlContent = "<!DOCTYPE html>\n" + clone.outerHTML;
                const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'dalton_law_simulation.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            // Custom Rounded Box Geometry generator for cast glass tank
            function createRoundedBox(width, height, depth, radius, smoothness) {
                const shape = new THREE.Shape();
                const eps = 0.00001;
                const r = radius - eps;
                const hw = width / 2;
                const hh = height / 2;

                shape.absarc(hw - r, hh - r, r, 0, Math.PI / 2, false);
                shape.absarc(-hw + r, hh - r, r, Math.PI / 2, Math.PI, false);
                shape.absarc(-hw + r, -hh + r, r, Math.PI, Math.PI * 1.5, false);
                shape.absarc(hw - r, -hh + r, r, Math.PI * 1.5, Math.PI * 2, false);

                const extrudeSettings = {
                    steps: 1,
                    depth: depth - radius * 2,
                    bevelEnabled: true,
                    bevelSegments: smoothness,
                    bevelSize: r,
                    bevelThickness: r
                };

                const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                geometry.center();
                return geometry;
            }

            function buildGlassChamber() {
                const wallThickness = 0.24; // Crisp, sleek double-wall glass thickness
                const ox = boxSize.x + wallThickness * 2;
                const oy = boxSize.y + wallThickness * 2;
                const oz = boxSize.z + wallThickness * 2;
                const hx = boxSize.x / 2, hy = boxSize.y / 2, hz = boxSize.z / 2;
                const ohx = ox / 2, ohy = oy / 2, ohz = oz / 2;

                // Clear laboratory glass: low face opacity, specular reflections on the actual 3D faces.
                // No fullscreen overlay and no disconnected rectangular reflection meshes.
                const outerBoxGeo = new THREE.BoxGeometry(ox, oy, oz);
                const outerGlassMat = new THREE.MeshPhysicalMaterial({
                    color: 0xf1fbff,
                    transparent: true,
                    opacity: 0.075,
                    roughness: 0.045,
                    metalness: 0.0,
                    reflectivity: 0.88,
                    clearcoat: 1.0,
                    clearcoatRoughness: 0.025,
                    depthWrite: false,
                    side: THREE.FrontSide
                });
                const outerGlassMesh = new THREE.Mesh(outerBoxGeo, outerGlassMat);
                outerGlassMesh.renderOrder = 1;
                scene.add(outerGlassMesh);

                // Fresnel reflection and two soft studio-light reflections.
                // These are fragments of the box surface itself, so they follow the
                // 3D camera when the user turns the chamber onto its side or top.
                const surfaceSheen = new THREE.ShaderMaterial({
                    transparent: true,
                    depthWrite: false,
                    depthTest: true,
                    side: THREE.FrontSide,
                    vertexShader: `
                        varying vec3 vViewNormal;
                        varying vec3 vViewPosition;
                        varying vec3 vObjectPosition;
                        void main() {
                            vec4 mv = modelViewMatrix * vec4(position, 1.0);
                            vViewNormal = normalize(normalMatrix * normal);
                            vViewPosition = -mv.xyz;
                            vObjectPosition = position;
                            gl_Position = projectionMatrix * mv;
                        }
                    `,
                    fragmentShader: `
                        varying vec3 vViewNormal;
                        varying vec3 vViewPosition;
                        varying vec3 vObjectPosition;
                        void main() {
                            vec3 n = normalize(vViewNormal);
                            vec3 v = normalize(vViewPosition);
                            float facing = abs(dot(n, v));
                            float fresnel = pow(1.0 - facing, 3.0);
                            // Reflect a bright strip from the studio environment, not a physical plane.
                            vec3 reflected = reflect(-v, n);
                            vec3 light1 = normalize(vec3(-0.48, 0.75, 0.46));
                            vec3 light2 = normalize(vec3(0.72, 0.26, 0.65));
                            float strip1 = pow(max(0.0, dot(reflected, light1)), 15.0);
                            float strip2 = pow(max(0.0, dot(reflected, light2)), 26.0);
                            float gentle = pow(max(0.0, dot(reflected, normalize(vec3(0.18, 0.94, -0.27)))), 5.0);
                            float alpha = 0.018 + fresnel * 0.38 + strip1 * 0.33 + strip2 * 0.24 + gentle * 0.065;
                            gl_FragColor = vec4(vec3(0.89, 0.97, 1.0), clamp(alpha, 0.0, 0.54));
                        }
                    `
                });
                const sheenMesh = new THREE.Mesh(outerBoxGeo, surfaceSheen);
                sheenMesh.scale.setScalar(1.002);
                sheenMesh.renderOrder = 2;
                scene.add(sheenMesh);

                // 2. Clean luminous outer rim edges
                const outerEdgeGeo = new THREE.EdgesGeometry(outerBoxGeo);
                const outerEdgeMat = new THREE.LineBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.78
                });
                scene.add(new THREE.LineSegments(outerEdgeGeo, outerEdgeMat));

                // 3. Inner chamber wall edge glow
                const innerBoxGeo = new THREE.BoxGeometry(boxSize.x, boxSize.y, boxSize.z);
                const innerEdgeGeo = new THREE.EdgesGeometry(innerBoxGeo);
                const innerLineMat = new THREE.LineBasicMaterial({
                    color: 0x7dd3fc,
                    transparent: true,
                    opacity: 0.35
                });
                scene.add(new THREE.LineSegments(innerEdgeGeo, innerLineMat));

                // 4. Clean 8-corner thickness struts connecting inner & outer glass walls
                const strutVerts = [];
                for (let sx of [-1, 1]) {
                    for (let sy of [-1, 1]) {
                        for (let sz of [-1, 1]) {
                            strutVerts.push(sx * hx, sy * hy, sz * hz);
                            strutVerts.push(sx * ohx, sy * ohy, sz * ohz);
                        }
                    }
                }
                const strutGeo = new THREE.BufferGeometry();
                strutGeo.setAttribute('position', new THREE.Float32BufferAttribute(strutVerts, 3));
                const strutLines = new THREE.LineSegments(strutGeo, new THREE.LineBasicMaterial({
                    color: 0xb6e7ff,
                    transparent: true,
                    opacity: 0.48
                }));
                scene.add(strutLines);

                // 5. Solid dark metallic lab base pedestal
                const baseHeight = 0.32;
                const baseGeo = new THREE.BoxGeometry(ox + 0.16, baseHeight, oz + 0.16);
                const baseMat = new THREE.MeshStandardMaterial({
                    color: 0x0f172a,
                    roughness: 0.30,
                    metalness: 0.75,
                    polygonOffset: true,
                    polygonOffsetFactor: 2,
                    polygonOffsetUnits: 2
                });
                const baseMesh = new THREE.Mesh(baseGeo, baseMat);
                baseMesh.position.y = -ohy - baseHeight / 2 + 0.02;
                baseMesh.receiveShadow = true;
                scene.add(baseMesh);
            }

            function fitFormula(elem) {
                if (!elem) return;
                const parent = elem.parentElement;
                if (!parent) return;
                elem.style.transform = 'none';
                const pWidth = parent.clientWidth;
                const eWidth = elem.scrollWidth;
                if (eWidth <= pWidth) {
                    parent.style.justifyContent = 'center';

                    parent.style.justifyContent = 'flex-start';
                }
            }

            function updatePressureCalculations() {
                const pH2 = molState.h2 * ATM_PER_MOL;
                const pHe = molState.he * ATM_PER_MOL;
                const pO2 = molState.o2 * ATM_PER_MOL;
                const pTotal = pH2 + pHe + pO2;
                const totalMol = molState.h2 + molState.he + molState.o2;

                document.getElementById('dialCenterReading').textContent = `${pTotal.toFixed(1)} atm`;
                document.getElementById('subPH2').textContent = `${pH2.toFixed(1)} atm`;
                document.getElementById('subPHe').textContent = `${pHe.toFixed(1)} atm`;
                document.getElementById('subPO2').textContent = `${pO2.toFixed(1)} atm`;

                const activeGasItems = [];
                if (molState.h2 > 0) {
                    activeGasItems.push({
                        key: 'h2',
                        mol: molState.h2,
                        p: pH2,
                        colorLatex: '\\textcolor{#f8fafc}',
                        textClass: 'text-slate-100',
                        labelHtml: '<span>P<sub>H₂</sub></span>',
                        latexTerm: `\\frac{\\textcolor{#f8fafc}{${molState.h2}} \\cdot 0.082 \\cdot 300}{1.0}`
                    });
                }
                if (molState.he > 0) {
                    activeGasItems.push({
                        key: 'he',
                        mol: molState.he,
                        p: pHe,
                        colorLatex: '\\textcolor{#38bdf8}',
                        textClass: 'text-sky-400',
                        labelHtml: '<span>P<sub>He</sub></span>',
                        latexTerm: `\\frac{\\textcolor{#38bdf8}{${molState.he}} \\cdot 0.082 \\cdot 300}{1.0}`
                    });
                }
                if (molState.o2 > 0) {
                    activeGasItems.push({
                        key: 'o2',
                        mol: molState.o2,
                        p: pO2,
                        colorLatex: '\\textcolor{#fb7185}',
                        textClass: 'text-rose-400',
                        labelHtml: '<span>P<sub>O₂</sub></span>',
                        latexTerm: `\\frac{\\textcolor{#fb7185}{${molState.o2}} \\cdot 0.082 \\cdot 300}{1.0}`
                    });
                }

                // 1. Board Card 1: Ideal Gas Formula
                const latexElem = document.getElementById('latexIdealGasFormula');
                if (latexElem) {
                    if (activeGasItems.length > 0) {
                        const termsLatex = activeGasItems.map(item => item.latexTerm).join(' + ');
                        
                        let katexSizeTag = '\\huge';
                        if (activeGasItems.length === 1) {
                            katexSizeTag = showCombinedFormula ? '\\LARGE' : '\\huge';
                        } else if (activeGasItems.length === 2) {
                            katexSizeTag = showCombinedFormula ? '\\Large' : '\\LARGE';
                        } else if (activeGasItems.length >= 3) {
                            katexSizeTag = showCombinedFormula ? '\\Large' : '\\LARGE';
                        }

                        let latexStr = `${katexSizeTag} P = ${termsLatex} = \\mathbf{${pTotal.toFixed(1)}}\\text{ atm}`;
                        
                        if (showCombinedFormula) {
                            const sumMolFormula = activeGasItems.map(item => `${item.colorLatex}{${item.mol}}`).join(' + ');
                            latexStr += ` = \\frac{(${sumMolFormula}) \\cdot 0.082 \\cdot 300}{1.0}`;
                        }

                        if (typeof katex !== 'undefined') {
                            katex.render(latexStr, latexElem, { displayMode: true, throwOnError: false });
                        } else {
                            latexElem.textContent = `P = ${pTotal.toFixed(1)} atm`;
                        }
                    } else {
                        const emptyLatex = `\\Large P = \\frac{0 \\cdot 0.082 \\cdot 300}{1.0} = 0.0\\text{ atm}`;
                        if (typeof katex !== 'undefined') {
                            katex.render(emptyLatex, latexElem, { displayMode: true, throwOnError: false });
                        } else {
                            latexElem.textContent = 'P = 0.0 atm';
                        }
                    }
                    fitFormula(latexElem);
                }

                // 2. Board Card 2: Dalton's Law Giant Symbolic & Numerical Decomposition
                const formulaText = document.getElementById('formulaText');
                const eqContainer = document.getElementById('equationContainer');

                if (activeGasItems.length > 0) {
                    const symbolsHtml = activeGasItems.map(item => `<span class="${item.textClass}">${item.labelHtml}</span>`).join(' + ');
                    formulaText.innerHTML = `<span>P<sub>總</sub></span> = ${symbolsHtml}`;

                    let numbersHtml = `<span class="text-amber-400 font-black">${pTotal.toFixed(1)}</span> = `;
                    numbersHtml += activeGasItems.map(item => `<span class="${item.textClass} font-black">${item.p.toFixed(1)}</span>`).join(' + ');
                    numbersHtml += ` <span class="text-slate-400 text-lg sm:text-xl font-bold ml-1">atm</span>`;
                    eqContainer.innerHTML = numbersHtml;
                    const eqParent = eqContainer.parentElement;
                    if (eqParent) {
                        if (eqContainer.scrollWidth > eqParent.clientWidth - 10) {
                            eqParent.style.justifyContent = 'flex-start';
                        } else {
                            eqParent.style.justifyContent = 'center';
                        }
                    }
                } else {
                    formulaText.innerHTML = `<span>P<sub>總</sub></span> = 0.0 atm`;
                    eqContainer.innerHTML = `<span class="text-slate-400 text-lg font-bold tracking-wide">P = 0.0 atm (尚未注入氣體)</span>`;
                }

                // 3. Board Card 3: Stacked Bar & Single-Row Smart-Spaced Contribution Badges
                const emptyMsg = document.getElementById('emptyFracMsg');
                const trackArea = document.getElementById('contribTrackArea');
                const badgeWrapH2 = document.getElementById('badgeWrapH2');
                const badgeWrapHe = document.getElementById('badgeWrapHe');
                const badgeWrapO2 = document.getElementById('badgeWrapO2');
                const badgeBoxH2 = document.getElementById('badgeBoxH2');
                const badgeBoxHe = document.getElementById('badgeBoxHe');
                const badgeBoxO2 = document.getElementById('badgeBoxO2');
                const badgeTickH2 = document.getElementById('badgeTickH2');
                const badgeTickHe = document.getElementById('badgeTickHe');
                const badgeTickO2 = document.getElementById('badgeTickO2');

                if (pTotal > 0.05 && totalMol > 0) {
                    const pctH2 = (pH2 / pTotal) * 100;
                    const pctHe = (pHe / pTotal) * 100;
                    const pctO2 = (pO2 / pTotal) * 100;

                    document.getElementById('barH2').style.width = pctH2 + '%';
                    document.getElementById('barHe').style.width = pctHe + '%';
                    document.getElementById('barO2').style.width = pctO2 + '%';
                    document.getElementById('stackedPercentText').textContent = `全部 = 1`;
                    if (trackArea) trackArea.style.minHeight = `202px`;

                    if (emptyMsg) emptyMsg.classList.add('hidden');

                    const gasConfigs = [
                        { key: 'h2', mol: molState.h2, pct: pctH2, wrap: badgeWrapH2, box: badgeBoxH2, tick: badgeTickH2, colorHex: '#f8fafc', label: 'H₂', borderClass: 'border-slate-500/60' },
                        { key: 'he', mol: molState.he, pct: pctHe, wrap: badgeWrapHe, box: badgeBoxHe, tick: badgeTickHe, colorHex: '#38bdf8', label: 'He', borderClass: 'border-sky-500/60' },
                        { key: 'o2', mol: molState.o2, pct: pctO2, wrap: badgeWrapO2, box: badgeBoxO2, tick: badgeTickO2, colorHex: '#fb7185', label: 'O₂', borderClass: 'border-rose-500/60' }
                    ];

                    let currentAccum = 0;
                    const activeGases = [];
                    gasConfigs.forEach(g => {
                        if (g.mol > 0) {
                            g.centerPct = currentAccum + g.pct / 2;
                            currentAccum += g.pct;
                            activeGases.push(g);
                        } else {
                            if (g.wrap) g.wrap.style.display = 'none';
                            if (g.box) g.box.innerHTML = '';
                        }
                    });

                    const trackWidth = trackArea ? trackArea.clientWidth : 0;
                    const numActive = activeGases.length;
                    const isNarrowMobile = trackWidth < 460;
                    const isVeryNarrow = trackWidth < 380;

                    // Dynamically size boxes based on container width & active gas count
                    activeGases.forEach(g => {
                        g.wrap.style.display = 'flex';
                        g.wrap.style.top = '33px';
                        
                        if (isVeryNarrow || (isNarrowMobile && numActive >= 3)) {
                            // Ultra-compact for small phones
                            g.box.className = `px-1.5 py-1.5 rounded-xl bg-slate-900/95 border ${g.borderClass} shadow-lg pointer-events-auto`;
                            g.box.innerHTML = `
                                <div class="flex flex-col items-center justify-center gap-0.5 sans-tc-bold tracking-wide text-center" style="color: ${g.colorHex}; min-width: 66px;">
                                    <div class="text-xs font-black leading-tight whitespace-nowrap">${g.label} 貢獻</div>
                                    <div class="flex flex-col items-center justify-center leading-none mono-num font-black">
                                        <span class="text-base leading-tight">${g.mol}</span>
                                        <span class="w-6 h-[2px] rounded-full bg-current opacity-90 my-0.5"></span>
                                        <span class="text-base leading-tight">${totalMol}</span>
                                    </div>
                                </div>
                            `;
                        } else if (isNarrowMobile || numActive >= 3) {
                            // Compact for normal mobile
                            g.box.className = `px-2 py-1.5 rounded-xl bg-slate-900/95 border ${g.borderClass} shadow-lg pointer-events-auto`;
                            g.box.innerHTML = `
                                <div class="flex flex-col items-center justify-center gap-1 sans-tc-bold tracking-wide text-center" style="color: ${g.colorHex}; min-width: 80px;">
                                    <div class="text-sm font-black leading-tight whitespace-nowrap">${g.label} 貢獻</div>
                                    <div class="flex flex-col items-center justify-center leading-none mono-num font-black">
                                        <span class="text-xl leading-tight">${g.mol}</span>
                                        <span class="w-8 h-[2px] rounded-full bg-current opacity-90 my-0.5"></span>
                                        <span class="text-xl leading-tight">${totalMol}</span>
                                    </div>
                                </div>
                            `;
                        } else {
                            // Standard desktop
                            g.box.className = `px-3 py-2 rounded-xl bg-slate-900/95 border ${g.borderClass} shadow-lg pointer-events-auto`;
                            g.box.innerHTML = `
                                <div class="flex flex-col items-center justify-center gap-1.5 sans-tc-bold tracking-wide text-center" style="color: ${g.colorHex}; min-width: 108px;">
                                    <div class="text-xl sm:text-2xl font-black leading-none whitespace-nowrap">${g.label} 貢獻</div>
                                    <div class="flex flex-col items-center justify-center leading-none mono-num font-black">
                                        <span class="text-2xl sm:text-3xl leading-none">${g.mol}</span>
                                        <span class="w-10 sm:w-12 h-[3px] rounded-full bg-current opacity-95 my-1"></span>
                                        <span class="text-2xl sm:text-3xl leading-none">${totalMol}</span>
                                    </div>
                                </div>
                            `;
                        }
                    });

                    // Measure actual rendered widths
                    activeGases.sort((a, b) => a.centerPct - b.centerPct);
                    activeGases.forEach(g => {
                        g.boxWidth = g.box.offsetWidth || (isVeryNarrow ? 70 : (isNarrowMobile ? 86 : 118));
                        g.idealX = trackWidth * (g.centerPct / 100);
                    });

                    const edgePad = isVeryNarrow ? 4 : (isNarrowMobile ? 6 : 10);
                    const minGap = isVeryNarrow ? 4 : (isNarrowMobile ? 6 : 12);
                    const availableW = Math.max(1, trackWidth - edgePad * 2);

                    let totalBoxesW = 0;
                    activeGases.forEach((g, i) => {
                        totalBoxesW += g.boxWidth;
                        if (i > 0) totalBoxesW += minGap;
                    });

                    let scaleFactor = 1;
                    if (totalBoxesW > availableW && totalBoxesW > 0) {
                        scaleFactor = Math.max(0.68, availableW / totalBoxesW);
                    }

                    activeGases.forEach(g => {
                        g.halfW = (g.boxWidth * scaleFactor) / 2;
                        g.minX = g.halfW + edgePad;
                        g.maxX = Math.max(g.minX, trackWidth - g.halfW - edgePad);
                        g.finalX = Math.min(g.maxX, Math.max(g.minX, g.idealX));
                    });

                    // Forward pass: ensure min spacing
                    const actualGap = minGap * scaleFactor;
                    for (let i = 1; i < activeGases.length; i++) {
                        const prev = activeGases[i - 1];
                        const curr = activeGases[i];
                        const minAllowed = prev.finalX + prev.halfW + curr.halfW + actualGap;
                        if (curr.finalX < minAllowed) curr.finalX = minAllowed;
                    }

                    // Backward pass: keep within right boundary
                    for (let i = activeGases.length - 1; i >= 0; i--) {
                        const curr = activeGases[i];
                        if (curr.finalX > curr.maxX) curr.finalX = curr.maxX;
                        if (i < activeGases.length - 1) {
                            const next = activeGases[i + 1];
                            const maxAllowed = next.finalX - next.halfW - curr.halfW - actualGap;
                            if (curr.finalX > maxAllowed) curr.finalX = maxAllowed;
                        }
                    }

                    // Final pass: strict zero-overlap constraint
                    for (let i = 1; i < activeGases.length; i++) {
                        const prev = activeGases[i - 1];
                        const curr = activeGases[i];
                        const minAllowed = prev.finalX + prev.halfW + curr.halfW + 2;
                        if (curr.finalX < minAllowed) curr.finalX = minAllowed;
                    }

                    const leaderSvg = document.getElementById('contribLeaders');
                    if (leaderSvg) {
                        leaderSvg.setAttribute('viewBox', `0 0 ${Math.max(1,trackWidth)} 202`);
                        leaderSvg.setAttribute('preserveAspectRatio','none');
                        leaderSvg.innerHTML = activeGases.map(g => {
                            const originX = g.idealX;
                            const endX = g.finalX;
                            const shade = g.colorHex;
                            return `<path d="M ${originX.toFixed(1)} 0 L ${endX.toFixed(1)} 31" fill="none" stroke="${shade}" stroke-width="2.5" stroke-linecap="round" opacity="0.87"/>` +
                              `<circle cx="${originX.toFixed(1)}" cy="0" r="3.3" fill="${shade}"/>` +
                              `<circle cx="${endX.toFixed(1)}" cy="31" r="3.3" fill="${shade}"/>`;
                        }).join('');
                    }
                    activeGases.forEach(g => {
                        if (!g.wrap || !g.box || !g.tick) return;
                        g.wrap.style.left = `${g.finalX.toFixed(1)}px`;
                        g.wrap.style.top = '33px';
                        g.wrap.style.zIndex = '20';
                        g.wrap.style.transform = scaleFactor < 0.99 ? `translateX(-50%) scale(${scaleFactor.toFixed(3)})` : 'translateX(-50%)';
                        g.wrap.style.transformOrigin = 'top center';
                        g.tick.style.display = 'none';
                    });
                } else {
                    document.getElementById('barH2').style.width = '0%';
                    document.getElementById('barHe').style.width = '0%';
                    document.getElementById('barO2').style.width = '0%';
                    document.getElementById('stackedPercentText').textContent = `真空 0.0 atm`;
                    if (trackArea) trackArea.style.minHeight = `202px`;
                    const leaderSvg = document.getElementById('contribLeaders');
                    if (leaderSvg) leaderSvg.innerHTML = '';

                    [badgeWrapH2, badgeWrapHe, badgeWrapO2].forEach(w => {
                        if (w) w.style.display = 'none';
                    });
                    [badgeBoxH2, badgeBoxHe, badgeBoxO2].forEach(b => {
                        if (b) b.innerHTML = '';
                    });
                    if (emptyMsg) emptyMsg.classList.remove('hidden');
                }

                // Needle angle mapping: 0 - 400 atm (-135deg to +135deg)
                const clampedP = Math.min(Math.max(pTotal, 0), 400);
                targetNeedleAngle = -135 + (clampedP / 400) * 270;
            }

            function initManometerDial() {
                const group = document.getElementById('dialTicksGroup');
                if (!group) return;
                group.innerHTML = '';

                const cx = 130;
                const cy = 130;
                const r = 98;
                const startAngleDeg = -135;
                const totalSweepDeg = 270;
                const maxAtm = 400;
                const divisions = 40;

                for (let i = 0; i <= divisions; i++) {
                    const frac = i / divisions;
                    const angleDeg = startAngleDeg + frac * totalSweepDeg;
                    const angleRad = (angleDeg - 90) * (Math.PI / 180);

                    const isMajor = i % 5 === 0;
                    const tickLen = isMajor ? 13 : 6;
                    const strokeColor = isMajor ? '#0f172a' : '#64748b';
                    const strokeWidth = isMajor ? 2.5 : 1.2;

                    const x1 = cx + Math.cos(angleRad) * r;
                    const y1 = cy + Math.sin(angleRad) * r;
                    const x2 = cx + Math.cos(angleRad) * (r - tickLen);
                    const y2 = cy + Math.sin(angleRad) * (r - tickLen);

                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', x1.toFixed(2));
                    line.setAttribute('y1', y1.toFixed(2));
                    line.setAttribute('x2', x2.toFixed(2));
                    line.setAttribute('y2', y2.toFixed(2));
                    line.setAttribute('stroke', strokeColor);
                    line.setAttribute('stroke-width', strokeWidth);
                    line.setAttribute('stroke-linecap', 'round');
                    group.appendChild(line);

                    if (isMajor) {
                        const textDist = r - tickLen - 12;
                        const tx = cx + Math.cos(angleRad) * textDist;
                        const ty = cy + Math.sin(angleRad) * textDist + 4;

                        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        text.setAttribute('x', tx.toFixed(2));
                        text.setAttribute('y', ty.toFixed(2));
                        text.setAttribute('text-anchor', 'middle');
                        text.setAttribute('fill', '#0f172a');
                        text.setAttribute('font-size', '11.5');
                        text.setAttribute('font-family', "'JetBrains Mono', monospace");
                        text.setAttribute('font-weight', '800');
                        text.textContent = Math.round(frac * maxAtm);
                        group.appendChild(text);
                    }
                }
            }

            function createMoleculeMesh(type) {
                const spec = SPECIES[type];
                const group = new THREE.Group();

                // Polished, high-contrast spheres for classroom projection.
                // White hydrogen needs a slightly shaded base to show curvature;
                // helium uses a rich blue base so the highlights do not wash out.
                const mat = (type === 'h2' || type === 'he')
                    ? new THREE.MeshPhysicalMaterial({
                        color: type === 'h2' ? 0xe3ebf5 : 0x168fe2,
                        roughness: type === 'h2' ? 0.075 : 0.055,
                        metalness: 0.06,
                        clearcoat: 1.0,
                        clearcoatRoughness: 0.018,
                        reflectivity: 1.0,
                        emissive: type === 'h2' ? 0x242b38 : 0x05375d,
                        emissiveIntensity: 0.10
                    })
                    : new THREE.MeshStandardMaterial({
                        color: spec.color,
                        roughness: spec.roughness,
                        metalness: spec.metalness,
                        emissive: spec.color,
                        emissiveIntensity: 0.12
                    });

                // Small glossy light reflections fixed to each sphere, so they
                // rotate and move WITH the gas particles (not over the glass).
                function addAtomGloss(atom) {
                    if (type !== 'h2' && type !== 'he') return;
                    const r = spec.radius;
                    const hotSpot = new THREE.Mesh(
                        new THREE.SphereGeometry(r * 0.165, 12, 10),
                        new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.94, depthWrite: false})
                    );
                    hotSpot.position.set(-r * 0.38, r * 0.45, r * 0.77);
                    atom.add(hotSpot);
                    const softSpot = new THREE.Mesh(
                        new THREE.SphereGeometry(r * 0.26, 12, 10),
                        new THREE.MeshBasicMaterial({color: type === 'he' ? 0x9fe9ff : 0xffffff, transparent: true, opacity: 0.24, depthWrite: false})
                    );
                    softSpot.position.set(-r * 0.32, r * 0.39, r * 0.78);
                    atom.add(softSpot);
                }

                if (spec.isDiatomic) {
                    const geo = new THREE.SphereGeometry(spec.radius, 32, 24);
                    const atom1 = new THREE.Mesh(geo, mat);
                    const atom2 = new THREE.Mesh(geo, mat);

                    atom1.position.x = -spec.bondLen / 2;
                    atom2.position.x = spec.bondLen / 2;
                    atom1.castShadow = true;
                    atom2.castShadow = true;
                    addAtomGloss(atom1);
                    addAtomGloss(atom2);

                    // Bond cylinder
                    const bondGeo = new THREE.CylinderGeometry(spec.radius * 0.45, spec.radius * 0.45, spec.bondLen, 10);
                    const bondMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.3 });
                    const bond = new THREE.Mesh(bondGeo, bondMat);
                    bond.rotation.z = Math.PI / 2;

                    group.add(atom1);
                    group.add(atom2);
                    group.add(bond);
                    group.userData.envelopeRadius = spec.radius + spec.bondLen / 2;
                } else {
                    const geo = new THREE.SphereGeometry(spec.radius, 32, 24);
                    const atom = new THREE.Mesh(geo, mat);
                    atom.castShadow = true;
                    addAtomGloss(atom);
                    group.add(atom);
                    group.userData.envelopeRadius = spec.radius;
                }

                // Random Initial Velocity & Angular Momentum
                const theta = Math.random() * Math.PI * 2;
                const phi = (Math.random() - 0.5) * Math.PI;
                const speed = spec.baseSpeed * (0.85 + Math.random() * 0.3);

                group.userData.type = type;
                group.userData.mass = spec.mass;
                group.userData.vx = Math.cos(phi) * Math.cos(theta) * speed;
                group.userData.vy = Math.sin(phi) * speed;
                group.userData.vz = Math.cos(phi) * Math.sin(theta) * speed;
                group.userData.rotSpeed = {
                    x: (Math.random() - 0.5) * 0.05,
                    y: (Math.random() - 0.5) * 0.05,
                    z: (Math.random() - 0.5) * 0.05
                };

                return group;
            }

            function syncMolecules() {
                const targetCounts = {
                    h2: molState.h2 * MOLECULES_PER_MOL,
                    he: molState.he * MOLECULES_PER_MOL,
                    o2: molState.o2 * MOLECULES_PER_MOL
                };

                const currentCounts = { h2: 0, he: 0, o2: 0 };
                const toKeep = [];

                molecules.forEach(m => {
                    const t = m.userData.type;
                    if (currentCounts[t] < targetCounts[t]) {
                        currentCounts[t]++;
                        toKeep.push(m);
                    } else {
                        scene.remove(m);
                    }
                });

                molecules = toKeep;

                ['h2', 'he', 'o2'].forEach(t => {
                    const needed = targetCounts[t] - currentCounts[t];
                    for (let i = 0; i < needed; i++) {
                        const m = createMoleculeMesh(t);
                        const hx = (boxSize.x / 2) - 1.2;
                        const hy = (boxSize.y / 2) - 1.2;
                        const hz = (boxSize.z / 2) - 1.2;

                        m.position.set(
                            (Math.random() - 0.5) * 2 * hx,
                            (Math.random() - 0.5) * 2 * hy,
                            (Math.random() - 0.5) * 2 * hz
                        );
                        scene.add(m);
                        molecules.push(m);
                    }
                });

                const totalParticles = molecules.length;
                const label = document.getElementById('particleCountLabel');
                const totalMol = molState.h2 + molState.he + molState.o2;
                if (label) {
                    label.textContent = `${totalMol} mol (${totalParticles} 顆示意)`;
                }

                updatePressureCalculations();
            }

            // Luxury showcase diamonds: refined faceting, pastel fire, and subtle premium sparkle.
            function createSparkleTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 96;
                canvas.height = 96;
                const ctx = canvas.getContext('2d');
                const cx = 48, cy = 48;
                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 22);
                grad.addColorStop(0, 'rgba(255,255,255,1)');
                grad.addColorStop(0.20, 'rgba(255,255,255,0.95)');
                grad.addColorStop(0.55, 'rgba(255,255,255,0.28)');
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(cx, cy, 22, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.82)';
                ctx.lineWidth = 2.2;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(48, 12); ctx.lineTo(48, 84);
                ctx.moveTo(12, 48); ctx.lineTo(84, 48);
                ctx.moveTo(24, 24); ctx.lineTo(72, 72);
                ctx.moveTo(72, 24); ctx.lineTo(24, 72);
                ctx.stroke();
                const tex = new THREE.CanvasTexture(canvas);
                tex.needsUpdate = true;
                return tex;
            }
            const diamondSparkleTexture = createSparkleTexture();

            function createSparkleSprite(size, colorHex, pos, rotation, opacity, scaleMul, speed, phase) {

            // ===== Irregular Natural Rocks / Minerals =====
            // Create 5 distinctly shaped, non-spherical geological rocks with rich textures and varied mineral colors:
            // 0: 赭紅赤鐵岩 (Red Hematite/Sandstone) - Jagged angular block with sharp fractured cliffs
            // 1: 青苔深板岩 (Dark Slate/Basalt) - Flat, layered polygonal stepped slab
            // 2: 綠簾花崗岩 (Mossy Olive Granite) - Asymmetric craggy boulder with rough facets
            // 3: 灰白石灰岩 (Porous Grey-White Limestone) - Irregular triangular wedge with concave eroded hollows
            // 4: 煙金砂金岩 (Smoky Sandstone/Gold-flecked Pyrite rock) - Elongated jagged obelisk/crystal-like shard

            function createNoiseTexture(baseColorHex, specColorHex, darkColorHex, noiseType) {
                const canvas = document.createElement('canvas');
                canvas.width = 256; canvas.height = 256;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = baseColorHex;
                ctx.fillRect(0, 0, 256, 256);
                
                // Add geological striations, mineral grains, and sediment layers
                let seed = 42;
                const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
                
                if (noiseType === 'layered') {
                    // Stratified sedimentary layers
                    for (let y = 0; y < 256; y += 4 + Math.floor(rand() * 8)) {
                        ctx.fillStyle = rand() > 0.5 ? specColorHex : darkColorHex;
                        ctx.globalAlpha = 0.18 + rand() * 0.22;
                        const h = 2 + rand() * 6;
                        ctx.fillRect(0, y, 256, h);
                    }
                } else if (noiseType === 'speckled') {
                    // Granitic salt-and-pepper mineral flecks
                    for (let i = 0; i < 900; i++) {
                        ctx.fillStyle = rand() > 0.4 ? specColorHex : darkColorHex;
                        ctx.globalAlpha = 0.15 + rand() * 0.35;
                        const rx = rand() * 256, ry = rand() * 256;
                        const r = 1 + rand() * 3.5;
                        ctx.beginPath();
                        ctx.arc(rx, ry, r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else if (noiseType === 'veined') {
                    // Fractured mineral veins
                    ctx.strokeStyle = specColorHex;
                    ctx.lineWidth = 2.0;
                    ctx.globalAlpha = 0.45;
                    for (let v = 0; v < 5; v++) {
                        ctx.beginPath();
                        let cx = rand() * 256, cy = 0;
                        ctx.moveTo(cx, cy);
                        while (cy < 256) {
                            cx += (rand() - 0.5) * 35;
                            cy += 15 + rand() * 30;
                            ctx.lineTo(cx, cy);
                        }
                        ctx.stroke();
                    }
                } else {
                    // Rough earthy mottled patch
                    for (let i = 0; i < 180; i++) {
                        ctx.fillStyle = rand() > 0.5 ? specColorHex : darkColorHex;
                        ctx.globalAlpha = 0.12 + rand() * 0.25;
                        ctx.beginPath();
                        ctx.arc(rand() * 256, rand() * 256, 8 + rand() * 22, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                
                // Micro-sand grain roughness
                ctx.globalAlpha = 0.10;
                for (let i = 0; i < 1200; i++) {
                    ctx.fillStyle = rand() > 0.5 ? '#ffffff' : '#000000';
                    ctx.fillRect(rand() * 256, rand() * 256, 1.5, 1.5);
                }
                
                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                return tex;
            }

            function createNaturalRock(size, index) {
                const group = new THREE.Group();

                // 5 distinct non-spherical rock architectures
                const rockConfigs = [
                    {
                        name: '赭紅赤鐵岩 (塊狀斷崖)',
                        baseColor: 0x9e3d2c, specColor: 0xd97757, darkColor: 0x541d14,
                        texType: 'layered',
                        roughness: 0.88,
                        metalness: 0.12,
                        geoGen: (sz) => {
                            // Jagged fractured rectangular block (like broken sandstone/quarry block)
                            const geo = new THREE.BoxGeometry(sz * 1.6, sz * 0.95, sz * 1.15, 6, 5, 5);
                            const pos = geo.attributes.position;
                            for (let i = 0; i < pos.count; i++) {
                                let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
                                // Sheared cliff facet on one side
                                if (x > 0.2 * sz) x += 0.18 * sz * Math.sign(x);
                                if (y > 0.1 * sz) y += (Math.sin(x * 3.5) + Math.cos(z * 4.2)) * 0.12 * sz;
                                // Chip and fracture bevels
                                const fracture = Math.sin(x * 5.0 + y * 4.0) * 0.08 * sz + Math.cos(z * 6.0) * 0.06 * sz;
                                pos.setXYZ(i, x + fracture, y + fracture * 0.6, z + fracture);
                            }
                            return geo;
                        }
                    },
                    {
                        name: '深青層理板岩 (平片階梯形)',
                        baseColor: 0x2e3b44, specColor: 0x526573, darkColor: 0x161d22,
                        texType: 'veined',
                        roughness: 0.72,
                        metalness: 0.22,
                        geoGen: (sz) => {
                            // Stepped polygonal flat slab (schist/slate)
                            const geo = new THREE.CylinderGeometry(sz * 1.45, sz * 1.6, sz * 0.45, 7, 3);
                            const pos = geo.attributes.position;
                            for (let i = 0; i < pos.count; i++) {
                                let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
                                // Asymmetric polygonal elongation
                                x *= 1.35;
                                z *= 0.85;
                                // Cleavage break steps
                                const step = Math.floor((y / (sz * 0.45) + 0.5) * 3) * 0.08 * sz;
                                const ridge = (Math.sin(x * 4.0) > 0 ? 0.09 : -0.05) * sz;
                                pos.setXYZ(i, x + ridge, y + step, z + ridge * 0.5);
                            }
                            return geo;
                        }
                    },
                    {
                        name: '苔綠橄欖花崗岩 (多稜角孤石)',
                        baseColor: 0x475338, specColor: 0x73835c, darkColor: 0x252c1d,
                        texType: 'speckled',
                        roughness: 0.94,
                        metalness: 0.05,
                        geoGen: (sz) => {
                            // Dodecahedron based multi-faceted angular boulder
                            const geo = new THREE.DodecahedronGeometry(sz * 1.05, 1);
                            const pos = geo.attributes.position;
                            for (let i = 0; i < pos.count; i++) {
                                let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
                                // Stretch along diagonal to break symmetry
                                x *= 1.25;
                                y *= 0.82;
                                z *= 1.10;
                                // Craggy impact hollows
                                const dist = Math.sqrt(x*x + y*y + z*z) || 1;
                                const crag = (Math.sin(x * 3.8 + z * 2.2) * 0.16 + Math.cos(y * 4.5) * 0.12) * sz;
                                pos.setXYZ(i, x + (x/dist)*crag, y + (y/dist)*crag, z + (z/dist)*crag);
                            }
                            return geo;
                        }
                    },
                    {
                        name: '灰白溶蝕石灰岩 (三角楔形/凹洞)',

                            for (let i = 0; i < pos.count; i++) {
                                let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
                                // Tilted triangular wedge
                                x += y * 0.35;
                                // Erosion depressions
                                const hollow = Math.sin(x * 6.0) * Math.sin(z * 6.0) * 0.14 * sz;
                                const bite = (x < 0 && z > 0) ? -0.18 * sz : 0.05 * sz;
                                pos.setXYZ(i, x + hollow + bite, y * 0.75, z + hollow);

                    {

                        metalness: 0.40, // slight metallic sheen of pyrite / iron ore
                        geoGen: (sz) => {
                            // Elongated irregular hexagonal crystal/obelisk
                            const geo = new THREE.CylinderGeometry(sz * 0.45, sz * 0.95, sz * 1.85, 5, 4);
                            const pos = geo.attributes.position;
                            for (let i = 0; i < pos.count; i++) {
                                let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);

                                }
                                // Prismatic column faces
                                const prismFluting = Math.sin(Math.atan2(z, x) * 5) * 0.09 * sz;
                                pos.setXYZ(i, x + prismFluting, y, z + prismFluting);
                            }
                            return geo;
                        }
                    }
                ];

                const cfg = rockConfigs[index % rockConfigs.length];
                const rawGeo = cfg.geoGen(size);
                
                // Flat shading for distinct geological facet planes
                rawGeo.computeVertexNormals();
                const tex = createNoiseTexture(
                    `#${cfg.baseColor.toString(16).padStart(6, '0')}`,
                    `#${cfg.specColor.toString(16).padStart(6, '0')}`,
                    `#${cfg.darkColor.toString(16).padStart(6, '0')}`,
                    cfg.texType
                );

                const mat = new THREE.MeshStandardMaterial({
                    map: tex,
                    color: 0xffffff,
                    roughness: cfg.roughness,
                    metalness: cfg.metalness,
                    flatShading: true, // Key: authentic faceted, angular rock fractures
                    bumpMap: tex,
                    bumpScale: 0.05
                });

                const mesh = new THREE.Mesh(rawGeo, mat);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                group.add(mesh);
                group.userData.coreMesh = mesh;

                // Subtle mineral accent patch / quartz inclusion / lichen crest
                const veinGeo = new THREE.DodecahedronGeometry(size * 0.26, 0);
                const veinMat = new THREE.MeshStandardMaterial({
                    color: cfg.specColor,
                    roughness: 0.6,
                    metalness: cfg.metalness > 0.1 ? 0.6 : 0.0,
                    flatShading: true
                });
                const vein = new THREE.Mesh(veinGeo, veinMat);
                vein.position.set(size * 0.35, size * 0.22, size * 0.25);
                vein.scale.set(1.4, 0.45, 0.85);
                group.add(vein);

                return group;
            }

            // ===== Brilliant-cut diamonds =====
            // Procedural "jewelry studio" environment: dark backdrop with bright softboxes and rainbow streaks,
            // so every facet reflects high-contrast flashes (brilliance) and colored fire (dispersion).
            function createDiamondEnvMap() {
                let seed = 7;
                const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
                const faces = [];
                for (let f = 0; f < 6; f++) {
                    const c = document.createElement('canvas');
                    c.width = 256; c.height = 256;
                    const ctx = c.getContext('2d');
                    const bg = ctx.createLinearGradient(0, 0, 0, 256);
                    bg.addColorStop(0, f === 2 ? '#3b4a66' : '#141b2e');
                    bg.addColorStop(1, f === 3 ? '#05070d' : '#0a0f1c');
                    ctx.fillStyle = bg;
                    ctx.fillRect(0, 0, 256, 256);
                    // Bright white softboxes
                    const nBoxes = f === 2 ? 6 : 4;
                    for (let i = 0; i < nBoxes; i++) {
                        const w = 18 + rand() * 60, h = 10 + rand() * 50;
                        const x = rand() * (256 - w), y = rand() * (256 - h);
                        ctx.fillStyle = `rgba(255,255,255,${0.75 + rand() * 0.25})`;
                        ctx.fillRect(x, y, w, h);
                    }
                    // Rainbow streaks (spectral fire)
                    const fire = ['#ff4d6d', '#ffb703', '#fff275', '#5cff9d', '#4cc9f0', '#7b61ff', '#f72585'];
                    for (let i = 0; i < 12; i++) {
                        ctx.fillStyle = fire[Math.floor(rand() * fire.length)];
                        ctx.globalAlpha = 0.75 + rand() * 0.25;
                        ctx.fillRect(rand() * 240, rand() * 240, 6 + rand() * 22, 6 + rand() * 22);
                    }
                    ctx.globalAlpha = 1;
                    // Tiny pin-point highlights
                    for (let i = 0; i < 26; i++) {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(rand() * 254, rand() * 254, 2 + rand() * 3, 2 + rand() * 3);
                    }
                    faces.push(c);
                }
                const cube = new THREE.CubeTexture(faces);
                cube.needsUpdate = true;
                return cube;
            }
            const diamondEnvMap = createDiamondEnvMap();

            function createGlowTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 128; canvas.height = 128;
                const ctx = canvas.getContext('2d');
                const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
                g.addColorStop(0, 'rgba(255,255,255,0.9)');
                g.addColorStop(0.25, 'rgba(200,240,255,0.45)');
                g.addColorStop(0.6, 'rgba(160,200,255,0.12)');
                g.addColorStop(1, 'rgba(160,200,255,0)');
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, 128, 128);
                const tex = new THREE.CanvasTexture(canvas);
                tex.needsUpdate = true;
                return tex;
            }
            const diamondGlowTexture = createGlowTexture();

            // Round brilliant geometry (girdle radius = 1, origin at girdle centre).
            function buildBrilliantGeometry() {
                const N = 8;
                const tableR = 0.56, crownH = 0.34, girdleH = 0.035, pavDepth = 0.86;
                const v = (r, a, y) => new THREE.Vector3(r * Math.cos(a), y, r * Math.sin(a));
                const step = Math.PI * 2 / N;
                const T = new THREE.Vector3(0, crownH, 0);
                const C = new THREE.Vector3(0, -girdleH - pavDepth, 0);
                const table = [], gTop = [], gBot = [], pav = [];
                for (let k = 0; k < N; k++) {
                    table.push(v(tableR, k * step, crownH));
                    // pavilion break points sit slightly inside the cone -> distinct main & lower-girdle facets
                    pav.push(v(0.40, k * step, -girdleH - pavDepth * 0.56));
                }
                for (let j = 0; j < N * 2; j++) {
                    gTop.push(v(1.0, j * step / 2, 0));
                    gBot.push(v(1.0, j * step / 2, -girdleH));
                }
                const G = (arr, j) => arr[(j + arr.length) % arr.length];

                const pos = [], col = [];
                const tints = [
                    [1.00, 1.00, 1.00], [0.88, 0.95, 1.00], [1.00, 0.90, 0.96],
                    [1.00, 0.97, 0.86], [0.92, 0.90, 1.00], [0.90, 1.00, 0.96]
                ];
                let tintIdx = 0;
                const tri = (a, b, c, bright) => {
                    // ensure outward winding (shape is convex around the origin)
                    const n = new THREE.Vector3().subVectors(b, a).cross(new THREE.Vector3().subVectors(c, a));
                    const centroid = new THREE.Vector3().add(a).add(b).add(c).multiplyScalar(1 / 3);
                    if (n.dot(centroid) < 0) { const t = b; b = c; c = t; }
                    const t = tints[(tintIdx++ * 7) % tints.length];
                    const s = bright || 1;
                    [a, b, c].forEach(p => { pos.push(p.x, p.y, p.z); col.push(t[0] * s, t[1] * s, t[2] * s); });
                };

                for (let k = 0; k < N; k++) {
                    const t0 = table[k], t1 = G(table, k + 1);
                    tri(T, t0, t1, 1.0);                                   // table
                    tri(t0, t1, G(gTop, 2 * k + 1), 1.0);                  // star facet
                    tri(t0, G(gTop, 2 * k - 1), G(gTop, 2 * k), 0.95);     // bezel (kite) halves
                    tri(t0, G(gTop, 2 * k), G(gTop, 2 * k + 1), 0.95);
                }
                for (let j = 0; j < N * 2; j++) {                          // girdle band
                    const a = gTop[j], b = G(gTop, j + 1), c = gBot[j], d = G(gBot, j + 1);
                    tri(a, c, b, 0.8); tri(b, c, d, 0.8);
                }
                for (let k = 0; k < N; k++) {                              // pavilion
                    const p0 = pav[k], p1 = G(pav, k + 1);
                    tri(G(gBot, 2 * k - 1), G(gBot, 2 * k), p0, 0.9);      // lower girdle facets
                    tri(G(gBot, 2 * k), G(gBot, 2 * k + 1), p0, 0.9);
                    tri(p0, G(gBot, 2 * k + 1), p1, 0.85);
                    tri(p0, p1, C, 0.85);                                  // pavilion mains
                }

                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
                geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
                geo.computeVertexNormals();
                return geo;
            }
            const brilliantGeometry = buildBrilliantGeometry();
            const brilliantEdges = new THREE.EdgesGeometry(brilliantGeometry, 1);

            function createDiamond(size, index) {
                const group = new THREE.Group();     // outer: slow spin about world Y
                const tilt = new THREE.Group();      // inner: tilt so the classic silhouette is visible
                group.add(tilt);
                const R = size * 1.25;               // girdle radius, comparable to the old pebbles
                tilt.scale.set(R, R, R);

                const tilts = [[0.42, 0.10], [0.95, -0.08], [0.62, 0.14], [1.12, -0.05], [0.75, 0.06]];
                tilt.rotation.set(tilts[index % 5][0], 0, tilts[index % 5][1]);

                // Inner back faces: the "internal reflections" seen through the stone
                const inner = new THREE.Mesh(brilliantGeometry, new THREE.MeshStandardMaterial({
                    color: 0xffffff, vertexColors: true, metalness: 1.0, roughness: 0.0,
                    envMap: diamondEnvMap, envMapIntensity: 2.2, side: THREE.BackSide,
                    flatShading: true
                }));
                inner.scale.setScalar(0.985);
                tilt.add(inner);

                // Outer crystal surface
                const outer = new THREE.Mesh(brilliantGeometry, new THREE.MeshPhysicalMaterial({
                    color: 0xffffff, vertexColors: true, metalness: 0.35, roughness: 0.0,
                    envMap: diamondEnvMap, envMapIntensity: 3.0, reflectivity: 1.0,
                    clearcoat: 1.0, clearcoatRoughness: 0.0,
                    emissive: 0x0b1424, emissiveIntensity: 0.25,
                    transparent: true, opacity: 0.72, flatShading: true, depthWrite: false
                }));
                outer.renderOrder = 2;
                tilt.add(outer);
                group.userData.coreMesh = outer;

                // Crisp facet edges
                const edges = new THREE.LineSegments(brilliantEdges, new THREE.LineBasicMaterial({
                    color: 0xe0f4ff, transparent: true, opacity: 0.40,
                    blending: THREE.AdditiveBlending, depthWrite: false
                }));
                edges.renderOrder = 3;
                tilt.add(edges);

                // Soft halo
                const halo = new THREE.Sprite(new THREE.SpriteMaterial({
                    map: diamondGlowTexture, color: 0xcfefff, transparent: true, opacity: 0.32,
                    depthWrite: false, blending: THREE.AdditiveBlending
                }));
                halo.scale.set(R * 3.4, R * 3.4, 1);
                halo.userData = { halo: true, baseOpacity: 0.32, baseScale: R * 3.4, phase: index * 1.3 };
                group.add(halo);

                // Twinkling star glints on facet corners
                const glintColors = [0xffffff, 0xbdf3ff, 0xffd6f5, 0xfff3b0, 0xffffff, 0xc7d2fe];
                const glintSpots = [
                    [0.56, 0.34, 0.0], [-0.40, 0.34, 0.40], [0.0, 0.34, -0.56],
                    [1.0, 0.0, 0.0], [-0.71, 0.0, -0.71], [0.0, -0.9, 0.0], [0.38, 0.12, 0.62]
                ];
                glintSpots.forEach((p, i) => {
                    const s = createSparkleSprite(1, glintColors[(i + index) % glintColors.length], p,
                        (i * 0.7 + index) % Math.PI, 0.95, 0.75 + 0.25 * ((i + index) % 3), 1.6 + 0.55 * ((i * 3 + index) % 5), i * 1.9 + index * 0.8);
                    s.renderOrder = 4;
                    tilt.add(s);
                });

                return group;
            }


            function syncStones() {
                while (stoneMeshes.length > stoneCount) {
                    const s = stoneMeshes.pop();
                    scene.remove(s);
                }

                const hy = boxSize.y / 2;
                const sizes = [0.85, 0.80, 0.76, 0.74, 0.65];
                const places = [
                    [-3.80,  0.55],
                    [-1.85,  0.10],
                    [ 0.15,  0.45],
                    [ 1.95,  0.15],
                    [ 3.75,  0.50]
                ];

                while (stoneMeshes.length < stoneCount) {
                    const idx = stoneMeshes.length;
                    const sz = sizes[idx];
                    let mesh;
                    if (idx === 4) {
                        // 第 5 顆（最後一顆）：閃耀晶鑽
                        mesh = createDiamond(sz, idx);
                        mesh.rotation.set(0, 2.88, 0);
                        mesh.userData.spinSpeed = 0.008;
                    } else {
                        // 前 4 顆：天然不規則地質岩石
                        mesh = createNaturalRock(sz, idx);
                        const rockRots = [
                            [0.15, 0.65, -0.10],   // 0: 赤鐵岩 傾斜平臥
                            [0.08, 1.45, 0.12],    // 1: 深板岩 階梯平板
                            [-0.22, 2.10, 0.35],   // 2: 綠簾花崗岩 粗礪塊體
                            [0.32, -0.85, 0.18],   // 3: 石灰岩 三角楔形
                        ];
                        mesh.rotation.set(rockRots[idx][0], rockRots[idx][1], rockRots[idx][2]);
                    }

                    const x = places[idx][0], z = places[idx][1];
                    mesh.position.set(x, 0, z);
                    mesh.updateMatrixWorld(true);

                    const core = mesh.userData.coreMesh || mesh;
                    const bbox = new THREE.Box3().setFromObject(core);
                    const offsetY = -hy - bbox.min.y + 0.004;
                    mesh.position.y += offsetY;
                    mesh.updateMatrixWorld(true);

                    const bbox2 = new THREE.Box3().setFromObject(core);
                    const sizeVec = new THREE.Vector3();
                    bbox2.getSize(sizeVec);
                    const center = new THREE.Vector3();
                    bbox2.getCenter(center);
                    const radius = Math.max(sizeVec.x, sizeVec.y, sizeVec.z) * 0.40;
                    mesh.userData.radius = radius;
                    mesh.userData.x = x;
                    mesh.userData.y = center.y;
                    mesh.userData.z = z;

                    scene.add(mesh);
                    stoneMeshes.push(mesh);
                }
            }

            function updateDiamondSparkles() {
                const t = performance.now() * 0.001;
                for (let i = 0; i < stoneMeshes.length; i++) {
                    const d = stoneMeshes[i];
                    if (d.userData && d.userData.spinSpeed) {
                        d.rotation.y += d.userData.spinSpeed;
                    }
                    d.traverse(obj => {
                        const u = obj.userData;
                        if (u && u.sparkle) {
                            // sharp, star-like flashes
                            const w = Math.max(0, Math.sin(t * u.twinkleSpeed + u.twinklePhase));
                            const flash = Math.pow(w, 8);
                            obj.material.opacity = 0.08 + u.baseOpacity * flash;
                            const sc = u.baseScale * (0.35 + 1.0 * flash);
                            obj.scale.set(sc, sc, 1);
                            obj.material.rotation += 0.01;
                        } else if (u && u.halo) {
                            const b = 0.85 + 0.15 * Math.sin(t * 1.4 + u.phase);
                            obj.material.opacity = u.baseOpacity * b;
                            obj.scale.set(u.baseScale * b, u.baseScale * b, 1);
                        }
                    });
                }
            }

            function createWallImpact(x, y, z, axis, sign, type) {
                if (wallImpacts.length > 14) {
                    const old = wallImpacts.shift();
                    scene.remove(old);
                    if (old.material) old.material.dispose();
                }

                const spec = SPECIES[type];
                const mat = new THREE.MeshBasicMaterial({
                    color: spec.color,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.65
                });

                const ring = new THREE.Mesh(impactRingGeo, mat);
                ring.position.set(x, y, z);

                if (axis === 'x') {
                    ring.rotation.y = Math.PI / 2;
                } else if (axis === 'y') {
                    ring.rotation.x = Math.PI / 2;
                }

                ring.userData = { life: 1.0 };
                scene.add(ring);
                wallImpacts.push(ring);
            }

            function updateWallImpacts() {
                for (let i = wallImpacts.length - 1; i >= 0; i--) {
                    const r = wallImpacts[i];
                    r.userData.life -= 0.11;
                    r.scale.addScalar(0.03);
                    r.material.opacity = r.userData.life * 0.65;

                    if (r.userData.life <= 0) {
                        scene.remove(r);
                        if (r.material) r.material.dispose();
                        wallImpacts.splice(i, 1);
                    }
                }
            }

            function updatePhysics() {
                const hx = boxSize.x / 2;
                const hy = boxSize.y / 2;
                const hz = boxSize.z / 2;

                for (let i = 0; i < molecules.length; i++) {
                    const m = molecules[i];
                    const u = m.userData;
                    const r = u.envelopeRadius;

                    m.position.x += u.vx;
                    m.position.y += u.vy;
                    m.position.z += u.vz;

                    m.rotation.x += u.rotSpeed.x;
                    m.rotation.y += u.rotSpeed.y;
                    m.rotation.z += u.rotSpeed.z;

                    // Wall Elastic Bounce with subtle impact ping
                    if (m.position.x - r < -hx) {
                        m.position.x = -hx + r;
                        u.vx = Math.abs(u.vx);
                        createWallImpact(-hx, m.position.y, m.position.z, 'x', -1, u.type);
                    } else if (m.position.x + r > hx) {
                        m.position.x = hx - r;
                        u.vx = -Math.abs(u.vx);
                        createWallImpact(hx, m.position.y, m.position.z, 'x', 1, u.type);
                    }

                    if (m.position.y - r < -hy) {
                        m.position.y = -hy + r;
                        u.vy = Math.abs(u.vy);
                        createWallImpact(m.position.x, -hy, m.position.z, 'y', -1, u.type);
                    } else if (m.position.y + r > hy) {
                        m.position.y = hy - r;
                        u.vy = -Math.abs(u.vy);
                        createWallImpact(m.position.x, hy, m.position.z, 'y', 1, u.type);
                    }

                    if (m.position.z - r < -hz) {
                        m.position.z = -hz + r;
                        u.vz = Math.abs(u.vz);
                        createWallImpact(m.position.x, m.position.y, -hz, 'z', -1, u.type);
                    } else if (m.position.z + r > hz) {
                        m.position.z = hz - r;
                        u.vz = -Math.abs(u.vz);
                        createWallImpact(m.position.x, m.position.y, hz, 'z', 1, u.type);
                    }

                    // Collisions with 3D Stones
                    for (let s = 0; s < stoneMeshes.length; s++) {
                        const st = stoneMeshes[s].userData;
                        const dx = m.position.x - st.x;
                        const dy = m.position.y - st.y;
                        const dz = m.position.z - st.z;
                        const distSq = dx * dx + dy * dy + dz * dz;
                        const minDist = r + st.radius;

                        if (distSq < minDist * minDist) {
                            const dist = Math.sqrt(distSq) || 0.001;
                            const nx = dx / dist;
                            const ny = dy / dist;
                            const nz = dz / dist;

                            m.position.x = st.x + nx * minDist;
                            m.position.y = st.y + ny * minDist;
                            m.position.z = st.z + nz * minDist;

                            const dot = u.vx * nx + u.vy * ny + u.vz * nz;
                            u.vx = (u.vx - 2 * dot * nx) * 1.02;
                            u.vy = (u.vy - 2 * dot * ny) * 1.02;
                            u.vz = (u.vz - 2 * dot * nz) * 1.02;
                        }
                    }

                    // Molecule-Molecule Elastic Collisions
                    for (let j = i + 1; j < molecules.length; j++) {
                        const m2 = molecules[j];
                        const u2 = m2.userData;
                        const dx = m2.position.x - m.position.x;
                        const dy = m2.position.y - m.position.y;
                        const dz = m2.position.z - m.position.z;
                        const distSq = dx * dx + dy * dy + dz * dz;
                        const minDist = r + u2.envelopeRadius;

                        if (distSq < minDist * minDist && distSq > 0.0001) {
                            const dist = Math.sqrt(distSq);
                            const nx = dx / dist;
                            const ny = dy / dist;
                            const nz = dz / dist;

                            const overlap = 0.5 * (minDist - dist);
                            m.position.x -= nx * overlap;
                            m.position.y -= ny * overlap;
                            m.position.z -= nz * overlap;
                            m2.position.x += nx * overlap;
                            m2.position.y += ny * overlap;
                            m2.position.z += nz * overlap;

                            const kx = u.vx - u2.vx;
                            const ky = u.vy - u2.vy;
                            const kz = u.vz - u2.vz;
                            const p = 2 * (nx * kx + ny * ky + nz * kz) / (u.mass + u2.mass);

                            u.vx -= p * u2.mass * nx;
                            u.vy -= p * u2.mass * ny;
                            u.vz -= p * u2.mass * nz;
                            u2.vx += p * u.mass * nx;
                            u2.vy += p * u.mass * ny;
                            u2.vz += p * u.mass * nz;
                        }
                    }
                }
            }

            function updateNeedle() {
                const diff = targetNeedleAngle - currentNeedleAngle;
                currentNeedleAngle += diff * 0.12;

                const needle = document.getElementById('manometerNeedle');
                if (needle) {
                    needle.setAttribute('style', `transform-origin: 130px 130px; transform: rotate(${currentNeedleAngle}deg);`);
                }
            }

            function setupCameraInteractivity(dom) {
                let isDragging = false;
                let prevMouseX = 0;
                let prevMouseY = 0;
                let spherical = { radius: 35.5, theta: -2.28, phi: 1.18 };
                const cameraTarget = new THREE.Vector3(1.1, 1.0, 0);

                function updateCameraPos() {
                    camera.position.x = cameraTarget.x + spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
                    camera.position.y = cameraTarget.y + spherical.radius * Math.cos(spherical.phi);
                    camera.position.z = cameraTarget.z + spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
                    camera.lookAt(cameraTarget);
                }

                updateCameraPos();

                dom.addEventListener('mousedown', e => {
                    isDragging = true;
                    prevMouseX = e.clientX;
                    prevMouseY = e.clientY;
                });
                window.addEventListener('mouseup', () => isDragging = false);
                window.addEventListener('mousemove', e => {
                    if (!isDragging) return;
                    const dx = e.clientX - prevMouseX;
                    const dy = e.clientY - prevMouseY;
                    prevMouseX = e.clientX;
                    prevMouseY = e.clientY;

                    spherical.theta -= dx * 0.007;
                    spherical.phi = Math.max(0.40, Math.min(Math.PI / 2 - 0.08, spherical.phi - dy * 0.007));
                    updateCameraPos();
                });

                dom.addEventListener('touchstart', e => {
                    if (e.touches.length === 1) {
                        isDragging = true;
                        prevMouseX = e.touches[0].clientX;
                        prevMouseY = e.touches[0].clientY;
                    }
                });
                window.addEventListener('touchend', () => isDragging = false);
                window.addEventListener('touchmove', e => {
                    if (!isDragging || e.touches.length !== 1) return;
                    const dx = e.touches[0].clientX - prevMouseX;
                    const dy = e.touches[0].clientY - prevMouseY;
                    prevMouseX = e.touches[0].clientX;
                    prevMouseY = e.touches[0].clientY;

                    spherical.theta -= dx * 0.007;
                    spherical.phi = Math.max(0.40, Math.min(Math.PI / 2 - 0.08, spherical.phi - dy * 0.007));
                    updateCameraPos();
                });
            }

            function updateGaugePipe() {
                const stage = document.getElementById('threeContainer');
                const gauge = document.getElementById('fixedGauge');
                const overlay = document.getElementById('gaugePipeOverlay');
                if (!stage || !gauge || !overlay || !camera) return;
                const sr = stage.getBoundingClientRect();
                const gr = gauge.getBoundingClientRect();
                if (!sr.width || !sr.height) return;
                overlay.setAttribute('viewBox', `0 0 ${sr.width} ${sr.height}`);
                const topY = boxSize.y / 2 + 0.28;
                const port = new THREE.Vector3(4.9, topY + 0.51, 0).project(camera);
                const sx = (port.x * 0.5 + 0.5) * sr.width;
                const sy = (-port.y * 0.5 + 0.5) * sr.height;
                // Fixed gauge is a 2D UI element: connect to its lower-left bezel.
                const gx = gr.left - sr.left + gr.width * 0.29;
                const gy = gr.bottom - sr.top - gr.height * 0.12;
                // Start upward from the port; route around the gauge, not over its dial.
                const midY = Math.min(sy - 32, gy + 17);
                const elbowX = Math.max(sx + 22, gx - 35);
                const path = `M ${sx.toFixed(1)} ${sy.toFixed(1)} ` +
                    `L ${sx.toFixed(1)} ${(sy-22).toFixed(1)} ` +
                    `Q ${sx.toFixed(1)} ${midY.toFixed(1)} ${(sx+22).toFixed(1)} ${midY.toFixed(1)} ` +
                    `L ${elbowX.toFixed(1)} ${midY.toFixed(1)} ` +
                    `Q ${gx.toFixed(1)} ${midY.toFixed(1)} ${gx.toFixed(1)} ${(midY-17).toFixed(1)} ` +
                    `L ${gx.toFixed(1)} ${gy.toFixed(1)}`;
                ['gaugePipeShadow', 'gaugePipeBody', 'gaugePipeHighlight'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.setAttribute('d', path);
                });
            }

            function onWindowResize() {
                const container = document.getElementById('threeContainer');
                if (!container || !renderer || !camera) return;
                const width = container.clientWidth;
                const height = container.clientHeight;
                if (width === 0 || height === 0) return;
                
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);
                updateGaugePipe();

                const latexElem = document.getElementById('latexIdealGasFormula');
                if (latexElem) fitFormula(latexElem);
            }

            function animate() {
                requestAnimationFrame(animate);

                if (isRunning) {
                    updatePhysics();
                    updateWallImpacts();
                }
                updateNeedle();
                updateGaugePipe();
                updateDiamondSparkles();

                renderer.render(scene, camera);
            }

            window.onload = function () {
                initManometerDial();
                initThreeScene();
                resetDefaults();
                animate();
            };
        </script>
    
</body></html>
