<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>化學科互動教學模擬實驗室 ‧ 國立中壢高中</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 15%, #1e293b, #090d16 85%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 760px;
      width: 100%;
      text-align: center;
    }
    header {
      margin-bottom: 36px;
    }
    .school-tag {
      display: inline-block;
      padding: 6px 18px;
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 2.3rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.description {
      color: #94a3b8;
      font-size: 1.05rem;
      max-width: 580px;
      margin: 0 auto;
      line-height: 1.6;
    }
    .card {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 24px;
      padding: 36px 32px;
      text-decoration: none;
      color: inherit;
      display: block;
      text-align: left;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      margin-bottom: 40px;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(56, 189, 248, 0.45);
      box-shadow: 0 24px 40px -10px rgba(56, 189, 248, 0.2);
      background: rgba(30, 41, 59, 0.85);
    }
    .card:hover::before {
      opacity: 1;
    }
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .card-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
    }
    .card-icon {
      font-size: 2.8rem;
    }
    .card h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ffffff;
    }
    .card p {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(148, 163, 184, 0.12);
      padding-top: 18px;
    }
    .tag-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tag {
      font-size: 0.8rem;
      color: #64748b;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px 10px;
      border-radius: 6px;
    }
    .btn-enter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0284c7;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .card:hover .btn-enter {
      background: #38bdf8;
      color: #0f172a;
      transform: translateX(3px);
    }
    footer {
      color: #64748b;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="school-tag">國立中壢高級中學 ‧ 化學科</div>
      <h1>化學互動模擬實驗室</h1>
      <p class="description">透過高互動性動態演算模型，探索抽象化學原理與微觀分子世界。</p>
    </header>

    <!-- 單一分壓單元卡片 -->
    <a href="pressure/" class="card">
      <div class="card-top">
        <span class="card-badge">高二化學 ‧ 氣體定律</span>
        <div class="card-icon">⚗️</div>
      </div>
      <h2>道爾頓分壓定律 (Dalton's Law)</h2>
      <p>探索混合氣體分壓、莫耳分率與固體佔位體積效應。內建「閃耀鑽石」與「天然岩石」雙風格互動模型。</p>
      <div class="card-footer">
        <div class="tag-list">
          <span class="tag">💎 閃耀鑽石版</span>
          <span class="tag">🪨 天然岩石版</span>
        </div>
        <div class="btn-enter">
          進入實驗模擬 &rarr;
        </div>
      </div>
    </a>

    <footer>
      國立中壢高中化學科教學教材庫 ‧ 建議使用 Chrome / Safari / Edge 瀏覽器
    </footer>
  </div>
</body>
</html>
